<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piață auto</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <nav>
        <div class="logo">
            <a href="index.html">TVGARAGE</a>
        </div>
        <div class="nav-item"><a href="arenda.html">Arendă Auto</a></div>
        <div class="nav-item"><a href="detailingauto.html">Detailing Auto</a></div>
        <div class="nav-item"><a href="vanzarejante.html">Vânzare Jante și Anvelope</a></div>
        <div class="nav-item"><a href="vanzaremasini.html">Vânzare Mașini</a></div>
    </nav>

    <div class="image-container">
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <img src="https://carsweek.ru/upload/iblock/d6e/d6edb48b6130864f4111e72c6dd0bce5.jpg" alt="Arendă Auto">
                </div>
                <div class="flip-card-back">Arendă Auto</div>
            </div>
        </div>

        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <img src="https://srv-auto.ru/wp-content/uploads/2022/12/36b2809d9897674158231710198533e0-min-768x512.jpeg" alt="Detailing Auto">
                </div>
                <div class="flip-card-back">Detailing Auto</div>
            </div>
        </div>

        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <img src="https://avatars.mds.yandex.net/get-altay/1363278/2a00000164f3cd1b5ccf990c1df83972ace1/XXL_height" alt="Vânzare Jante și Anvelope">
                </div>
                <div class="flip-card-back">Vânzare Jante și Anvelope</div>
            </div>
        </div>

        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <img src="https://arhmez.ru/wp-content/uploads/d/0/0/d00fcb6c783456299138f68269ee8410.jpeg" alt="Vânzare Mașini">
                </div>
                <div class="flip-card-back">Vânzare Mașini</div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.flip-card').forEach(card => {
            card.addEventListener('click', () => {
                card.classList.toggle('flipped');
            });
        });
    </script>

<script>
    window.addEventListener('load', () => {
        document.querySelectorAll('.image-container, .image-item').forEach(el => {
            el.classList.add('rise-up');
        });
    });
</script>

    
</body>
</html>
